<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waiting Room (TEST CLONE)</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; }
    .banner { background: #b00020; color: #fff; padding: 6px; font-weight: 600; }
    #hlLinkToQueueTicket2Text { display: inline-block; margin-top: 30px; padding: 10px 18px;
      border: 2px solid #BF5700; color: #BF5700; border-radius: 8px; text-decoration: none; font-weight: 700; }
    #through h2 { color: #2e7d32; }
  </style>
</head>
<body>
  <div class="banner">⚠️ LOCAL TEST CLONE — waiting room</div>
  <h1>Student Ticket Queue — Waiting Room</h1>
  <p>You're signed in and in line.</p>
  <!-- The element the app monitors; it disappears when you clear the queue. -->
  <a id="hlLinkToQueueTicket2Text" href="#">View your queue ticket</a>
  <div id="through" style="display:none;"><h2>✅ It's your turn!</h2></div>
  <script>
    // Optional deterministic auto-advance (?advanceMs=N) for full-flow tests.
    var params = new URLSearchParams(location.search);
    var advanceMs = parseInt(params.get('advanceMs') || '', 10);
    function clearQueue() {
      var l = document.getElementById('hlLinkToQueueTicket2Text');
      if (l && l.parentNode) l.remove();
      document.getElementById('through').style.display = 'block';
    }
    if (!isNaN(advanceMs)) setTimeout(clearQueue, advanceMs);
  </script>
</body>
</html>
